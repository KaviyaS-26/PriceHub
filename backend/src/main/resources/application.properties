# PriceHub Application Configuration
server.port=${PORT:8080}
spring.application.name=pricehub-backend

# Default Database Configuration: H2 In-Memory with MySQL compatibility mode
# Allows immediate local execution without external prerequisites
spring.datasource.url=jdbc:h2:mem:pricehub_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret & Expiration Configuration
pricehub.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
pricehub.jwt.expiration-ms=86400000

# CORS Allowed Origins
pricehub.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
